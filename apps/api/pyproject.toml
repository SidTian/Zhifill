[project]
name = "zhifill-api"
version = "0.1.0"
description = "智填 ZhiFill API"
# 基准 3.12；允许 3.13。禁止 <3.12 与 >=3.14
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0,<0.142",
  "uvicorn[standard]>=0.30.0,<0.53",
  "pydantic>=2.6.0,<3",
  "pydantic-settings>=2.4.0,<3",
  "python-multipart>=0.0.9,<0.1",
  "aff-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "httpx>=0.27,<0.29",
  "jsonschema>=4.23,<5",
]
# P1 知识文件解析（实现期启用）
ingest = [
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "markdown>=3.5,<4",
]
# P2 LightRAG（实现期启用；版本随官方再收紧）
rag = [
  "lightrag-hku>=1.3,<2",
]
# P3 待填表解析
fill = [
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pypdf>=5.0,<6",
  "pdfplumber>=0.11,<0.12",
]
# P3 Agent：LLM 调用统一走 OpenAI-compatible SDK（Qwen DashScope / Ollama / DeepSeek）
agent = [
  "openai>=1.40,<2",
]
# P4 写回
export = [
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pypdf>=5.0,<6",
]
all = [
  "pytest>=8.0,<10",
  "httpx>=0.27,<0.29",
  "jsonschema>=4.23,<5",
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "markdown>=3.5,<4",
  "lightrag-hku>=1.3,<2",
  "pdfplumber>=0.11,<0.12",
  "openai>=1.40,<2",
]

[tool.uv.sources]
aff-contracts = { path = "../../packages/contracts/python", editable = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
